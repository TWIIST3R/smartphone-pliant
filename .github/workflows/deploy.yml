# Build et mise en ligne sur OVH.
# - à chaque push sur main (nouvel article, modification du site) ;
# - toutes les heures : vérifie sur le site si un article dont l'heure de publication est passée manque
#   et, seulement dans ce cas, reconstruit le site (le build n'inclut que les articles dont pubDate <= maintenant).
#   GitHub retarde souvent les tâches planifiées de plusieurs heures : la vérification sur le site
#   garantit qu'un article manqué est rattrapé au passage suivant.
# Secrets à créer dans GitHub (Settings › Secrets and variables › Actions) :
#   FTP_SERVER      ex. ftp.cluster0XX.hosting.ovh.net (espace client OVH › Hébergement › FTP-SSH)
#   FTP_USERNAME    identifiant FTP OVH
#   FTP_PASSWORD    mot de passe FTP OVH
#   FTP_SERVER_DIR  ex. /www/  (dossier racine du site, avec le slash final)
name: Build et mise en ligne

on:
  push:
    branches: [main]
  schedule:
    # Toutes les heures, à une minute peu chargée (les passages sont souvent retardés par GitHub).
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'

      - name: Article arrivé à échéance ?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/due-articles.mjs
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.due == 'true'
    # Les secrets FTP sont rangés dans l'environnement GitHub « FTP » (Settings › Environments)
    environment: FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache des images optimisées par Astro (évite de reconvertir toutes les photos à chaque build)
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-

      - name: Build
        run: npm run build

      - name: Contrôle du cocon
        run: npm run check-links

      - name: Envoi FTP (fichiers modifiés uniquement)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
