    <path d="M78 104c-4-40 22-60 54-60 30 0 52 16 50 46-10-14-30-20-52-16-20 3-36 12-52 30z" fill="#3b2a22"/>
    <path d="M112 50c14-12 44-12 58 4-18-4-38-2-58-4z" fill="#4a352b"/>
    <!-- barbe légère -->
    <path d="M88 124c4 30 22 42 40 42s36-12 40-42c-8 14-22 20-40 20s-32-6-40-20z" fill="#b98a6c" opacity=".45"/>
    <!-- lunettes -->
    <rect x="90" y="104" width="32" height="24" rx="9" fill="#fff" fill-opacity=".35" stroke="#15171c" stroke-width="4"/>
    <rect x="134" y="104" width="32" height="24" rx="9" fill="#fff" fill-opacity=".35" stroke="#15171c" stroke-width="4"/>
    <path d="M122 114h12" stroke="#15171c" stroke-width="4"/>
    <!-- yeux -->
    <circle cx="106" cy="116" r="3.6" fill="#15171c"/>
    <circle cx="150" cy="116" r="3.6" fill="#15171c"/>
