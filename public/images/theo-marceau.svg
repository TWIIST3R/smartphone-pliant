<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Avatar illustré de Théo Marceau">
  <defs>
    <clipPath id="c"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="256" height="256" fill="#fcebe4"/>
    <circle cx="206" cy="52" r="46" fill="#f6d3c4"/>
    <!-- buste -->
    <path d="M36 256c4-52 40-78 92-78s88 26 92 78z" fill="#0f6d63"/>
    <path d="M104 182c6 16 42 16 48 0l-4-10h-40z" fill="#e9b48f"/>
    <path d="M100 186l28 26 28-26" fill="none" stroke="#0b4f48" stroke-width="5" stroke-linejoin="round"/>
    <!-- cou -->
    <rect x="110" y="146" width="36" height="36" rx="12" fill="#e2a57f"/>
    <!-- oreilles -->
    <ellipse cx="78" cy="118" rx="10" ry="14" fill="#e2a57f"/>
    <ellipse cx="178" cy="118" rx="10" ry="14" fill="#e2a57f"/>
    <!-- visage -->
    <rect x="80" y="62" width="96" height="104" rx="46" fill="#edb894"/>
