    <path d="M112 146c10 8 22 8 32 0" fill="none" stroke="#8c4a36" stroke-width="4" stroke-linecap="round"/>
    <!-- pliant tenu en main -->
    <g transform="rotate(-12 196 206)">
      <rect x="170" y="176" width="26" height="54" rx="5" fill="#15171c"/>
      <rect x="198" y="176" width="26" height="54" rx="5" fill="#e2471b"/>
      <path d="M197 172v62" stroke="#fcebe4" stroke-width="2" stroke-dasharray="3 3"/>
